<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quick Note Lite v16</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ea;color:#222;font:14px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}.bar{position:sticky;top:0;z-index:9;display:flex;gap:5px;align-items:center;padding:7px;background:rgba(246,243,234,.96);border-bottom:1px solid #ddd4c4;backdrop-filter:blur(10px);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}.bar::-webkit-scrollbar{height:4px}button,input{border:1px solid #d5cbbb;background:#fffaf0;border-radius:8px;padding:5px 7px;font-size:13px;min-height:32px;transition:.12s;vertical-align:middle}button{cursor:pointer}button:hover{background:#f0e4d1;transform:translateY(-1px);box-shadow:0 2px 8px #0001}.pop{position:fixed;z-index:80;display:none;background:#fffdf8;border:1px solid #d5cbbb;border-radius:10px;padding:4px;box-shadow:0 10px 30px #0002;gap:3px}.pop.show{display:grid}.pop button{min-width:42px;text-align:left;background:#fffaf0}button:active{transform:translateY(0)}.sep{width:1px;min-width:1px;height:22px;background:#d8cebe;margin:0 1px}.hint{margin-left:auto;color:#766d62;font-size:12px}.app{display:block;max-width:920px;margin:14px auto;padding:0 12px}.wrap{min-width:0}#toc{position:fixed;top:58px;left:max(12px,calc(50% - 460px - 230px));width:210px;z-index:20;max-height:calc(100vh - 80px);overflow:auto;background:#fffdf8;border:1px solid #e3d9c8;border-radius:14px;padding:10px;box-shadow:0 6px 20px #46321412}#toc h3{font-size:13px;margin:0 0 8px;color:#6e5d48}#toc button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;min-height:0;padding:4px 6px;color:#5a4d40;box-shadow:none;transform:none;overflow:hidden;text-overflow:ellipsis}#toc button:hover{background:#f4eadb}.lv2{padding-left:16px!important}.lv3{padding-left:28px!important}.lv4,.lv5,.lv6{padding-left:40px!important}#ed{min-height:calc(100vh - 92px);background:#fffdf8;border:1px solid #e3d9c8;border-radius:16px;box-shadow:0 8px 28px rgba(70,50,20,.08);padding:28px;outline:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;caret-color:#111;transition:box-shadow .18s,border-color .18s}#ed:focus{border-color:#c6a56f;box-shadow:0 12px 36px rgba(70,50,20,.16)}#ed:empty:before{content:"直接输入 / 粘贴。支持富文本、纯文本、标题、列表、任务、引用、代码块、链接、目录、查找替换。";color:#9b9287}h1{font-size:1.8em}h2{font-size:1.55em}h3{font-size:1.35em}h4{font-size:1.18em}h5{font-size:1.08em}h6{font-size:1em;color:#6b6258}blockquote{border-left:4px solid #d7c5a5;margin:12px 0;padding:6px 12px;background:#faf3e8;color:#4a4037}pre{background:#eef7ef;color:#25372b;border:1px solid #d8e9d9;border-radius:12px;padding:12px;overflow:auto;white-space:pre-wrap}code{background:#eef0ec;border-radius:5px;padding:1px 4px;font-family:Consolas,Menlo,monospace}pre code{background:transparent;padding:0}.task{display:flex;align-items:flex-start;gap:7px;margin:4px 0}.task input{min-height:auto;margin-top:5px;padding:0}.task.done span{text-decoration:line-through;color:#888}mark.findhit{background:#fff08a;color:inherit;padding:0 2px;border-radius:2px}.panel{position:fixed;right:14px;top:58px;z-index:30;background:#fffdf8;border:1px solid #d8cebe;border-radius:14px;box-shadow:0 10px 30px #0002;padding:10px;display:none;gap:6px;max-width:calc(100vw - 28px)}.panel.show{display:grid}.panel input{width:180px}.toast{position:fixed;right:14px;bottom:14px;background:#222;color:#fff;padding:8px 12px;border-radius:10px;opacity:0;transition:.2s;font-size:13px;z-index:40}.toast.show{opacity:.92}body.notoc #toc{display:none}body.zen{background:#fffdf8}body.zen .bar,body.zen #toc{display:none}body.zen .app{display:block;max-width:920px;margin:0 auto;padding:24px}body.zen #ed{display:block;max-width:920px;margin:0 auto;min-height:calc(100vh - 48px);border:0;border-radius:0;box-shadow:none;background:#fffdf8;padding:24px;font-size:16px}.zenexit{display:none;position:fixed;left:18px;bottom:18px;z-index:60;opacity:.18;background:transparent;border:0;box-shadow:none;color:#6b6258;font-size:20px}.zenexit:hover{opacity:.85;background:#fffaf0}body.zen .zenexit{display:block}
@media(max-width:760px){body{background:#fffdf8}.bar{padding:7px 7px 7px max(7px,env(safe-area-inset-left));gap:4px;box-shadow:0 2px 10px #0001}.app{display:block;margin:0 auto;padding:0;max-width:360px}#toc{display:none;position:fixed;left:8px;right:8px;top:52px;z-index:25;max-height:45vh;width:auto}.showtoc #toc{display:block}#ed{border:0;border-radius:0;box-shadow:none;min-height:calc(100vh - 52px);padding:18px 15px 80px;font-size:14px;line-height:1.72}#ed:focus{box-shadow:inset 0 0 0 2px rgba(198,165,111,.12)}.hint{display:none}.panel{left:8px;right:8px;top:54px}.panel input{width:100%}button{font-size:13px;min-height:36px;padding:6px 8px}body.zen .app{max-width:360px;padding:18px 0;margin:0 auto}body.zen #ed{max-width:360px;width:100%;padding:18px 14px 80px;font-size:16px;min-height:100vh}.zenexit{left:12px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:20px}}
</style></head><body class="notoc">
<div class="bar"><button onclick="togToc()" title="目录">☰</button><button onclick="cmd('undo')" title="撤销">↶</button><button onclick="cmd('redo')" title="重做">↷</button><button id="fmtB" onclick="popMenu(this,'fmt')" title="段落/标题">p</button><button onclick="cmd('bold')" title="加粗"><b>B</b></button><button onclick="cmd('italic')" title="斜体"><i>I</i></button><button onclick="cmd('underline')" title="下划线"><u>U</u></button><button onclick="cmd('strikeThrough')" title="删除线">S̶</button><span class="sep"></span><button id="lstB" onclick="popMenu(this,'lst')" title="列表">•</button><button id="alignB" onclick="popMenu(this,'align')" title="对齐">⇤</button><button onclick="toggleQuote()" title="引用/取消引用">❝</button><button onclick="mkLink()" title="链接">🔗</button><button id="codeB" onclick="popMenu(this,'code')" title="代码">```</button><span class="sep"></span><button id="pmB" onclick="toggleTextMode()" title="正文模式：当前为富文本，点击转为纯文本">📋¶</button><button onclick="showFind()" title="查找替换">⌕</button><button onclick="zenOn()" title="禅定模式">🧘</button><button onclick="copyRich()" title="富文本复制">⎘T</button><button onclick="copyPlain()" title="纯文本复制">⎘¶</button><button onclick="downloadNote()" title="下载 HTML">⭳</button><button onclick="clearEd()" title="清空">🧹</button><span id="st" class="hint">Ready</span></div>
<button class="zenexit" onclick="zenOff()" title="退出禅定">✕</button>
<div class="app"><aside id="toc"><h3>☰</h3><div id="toclist"></div></aside><main class="wrap"><article id="ed" contenteditable="true" spellcheck="false"></article></main></div>
<div id="pop" class="pop"></div>
<div id="findp" class="panel"><input id="fq" placeholder="查找"><input id="rp" placeholder="替换为"><div><button onclick="findNext()">↓</button><button onclick="replaceOne()">替换</button><button onclick="replaceAll()">全部</button><button onclick="hideFind()">×</button></div><small id="fc"></small></div><div id="toast" class="toast"></div>
<script>
const ed=document.getElementById('ed'),toast=document.getElementById('toast'),st=document.getElementById('st'),toclist=document.getElementById('toclist'),popEl=document.getElementById('pop'),KEY='quick_note_lite_v13';let timer=null,changed=false,textMode='rich',richBackup='',plainStartText='';try{document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
function note(s){toast.textContent=s;toast.className='toast show';setTimeout(()=>toast.className='toast',1300)}
const menus={fmt:[['p','p'],['h1','H1'],['h2','H2'],['h3','H3'],['h4','H4'],['h5','H5'],['h6','H6']],lst:[['none','∅'],['ul','•'],['ol','1.'],['task','☑']],align:[['left','⇤'],['center','中'],['right','⇥'],['full','⇿']],code:[['block','```'],['inline','`']]};
function popMenu(btn,k){popEl.innerHTML='';menus[k].forEach(([v,l])=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>pick(k,v,l);popEl.appendChild(b)});let r=btn.getBoundingClientRect();popEl.style.left=Math.min(r.left,innerWidth-170)+'px';popEl.style.top=(r.bottom+4)+'px';popEl.className='pop show';popEl.dataset.btn=btn.id}
function closePop(){popEl.className='pop'}
function pick(k,v,l){closePop();let btn=document.getElementById(k+'B');if(btn)btn.textContent=l;if(k==='fmt')fmt(v);else if(k==='lst')lst(v);else if(k==='align')align(v);else if(k==='code')code(v)}
function setTextModeBtn(){let b=document.getElementById('pmB');b.textContent=textMode==='plain'?'📋T':'📋¶';b.title=textMode==='plain'?'正文模式：当前为纯文本，点击切回富文本':'正文模式：当前为富文本，点击转为纯文本'}
function textToHtml(t){return esc(t).replace(/\n/g,'<br>')}
function toggleTextMode(){if(textMode==='rich'){richBackup=ed.innerHTML;plainStartText=ed.innerText;ed.textContent=plainStartText;textMode='plain';setTextModeBtn();saveSoon();updToc();note('📋T')}else{let cur=ed.innerText;if(richBackup&&cur===plainStartText)ed.innerHTML=richBackup;else ed.innerHTML=textToHtml(cur);textMode='rich';setTextModeBtn();saveSoon();updToc();note('📋¶')}ed.focus()}
document.addEventListener('click',e=>{if(!e.target.closest('.pop')&&!e.target.closest('.bar'))closePop()});
function cmd(a,b=null){document.execCommand(a,false,b);ed.focus();saveSoon();updToc()}
function fmt(v){if(v)cmd('formatBlock',v)}
function curNode(){let s=getSelection();return s&&s.rangeCount?s.anchorNode:null}
function curEl(){let n=curNode();return n&&n.nodeType===3?n.parentElement:n}
function removeList(){let e=curEl();if(!e)return;let taskEl=e.closest('.task');if(taskEl){let d=document.createElement('div');d.textContent=taskEl.innerText.trim();taskEl.replaceWith(d);saveSoon();return}let li=e.closest('li');if(li){let p=li.parentElement;if(p&&p.tagName==='UL')cmd('insertUnorderedList');else if(p&&p.tagName==='OL')cmd('insertOrderedList');return}cmd('formatBlock','p')}
function lst(v){if(v==='none')removeList();else if(v==='ul')cmd('insertUnorderedList');else if(v==='ol')cmd('insertOrderedList');else task()}
function align(v){cmd({left:'justifyLeft',center:'justifyCenter',right:'justifyRight',full:'justifyFull'}[v]||'justifyLeft')}
function code(v){v==='inline'?inlineCode():codeBlock()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function enc(s){return btoa(unescape(encodeURIComponent(s))).replace(/=+$/,'')}
function dec(s){return decodeURIComponent(escape(atob(s)))}
function store(x){let ok=false;try{localStorage.setItem(KEY,x);ok=true}catch(e){}try{window.name=KEY+':'+x}catch(e){}try{history.replaceState(null,'','#'+enc(x))}catch(e){}return ok}
function restore(){let x='';try{x=localStorage.getItem(KEY)||''}catch(e){}if(!x&&location.hash.length>1)try{x=dec(location.hash.slice(1))}catch(e){}if(!x&&window.name.startsWith(KEY+':'))x=window.name.slice(KEY.length+1);if(x)ed.innerHTML=x}
function save(){let ok=store(ed.innerHTML);changed=false;st.textContent=ok?'✓':'◌';updToc();return ok}
function saveSoon(){changed=true;st.textContent='…';clearTimeout(timer);timer=setTimeout(save,250)}
function sel(){let s=getSelection();return s&&s.rangeCount?s.getRangeAt(0):null}
function inlineCode(){let r=sel();if(!r)return;let c=document.createElement('code');try{r.surroundContents(c)}catch(e){c.textContent=r.toString();r.deleteContents();r.insertNode(c)}ed.focus();saveSoon()}
function codeBlock(){let x=getSelection().toString()||'code';document.execCommand('insertHTML',false,'<pre><code>'+esc(x)+'</code></pre><p><br></p>');saveSoon()}
function task(){document.execCommand('insertHTML',false,'<div class="task"><input type="checkbox"> <span>任务项</span></div><div><br></div>');saveSoon()}
function toggleQuote(){let e=curEl();if(e&&e.closest('blockquote'))cmd('formatBlock','p');else cmd('formatBlock','blockquote')}
function parseMdLink(s){let m=s.match(/^\s*\[([^\]]*)\]\(([^)]*)\)\s*$/);return m?[m[1],m[2]]:null}
function isUrl(s){return /^(https?:\/\/|mailto:|tel:|\/|#)/i.test(s)}
function mkLink(){let txt=getSelection().toString()||'',raw=prompt('输入 [名称](链接)，或只输入链接',txt?'['+txt+'](https://)':'https://');if(raw===null)return;raw=raw.trim();let p=parseMdLink(raw),name,url;if(p){name=p[0]||p[1];url=p[1]||p[0]}else{url=raw;name=txt||raw}if(!url)return;if(!isUrl(url)&&url.includes('.'))url='https://'+url;document.execCommand('insertHTML',false,'<a href="'+esc(url)+'" target="_blank">'+esc(name||url)+'</a>');saveSoon()}
ed.addEventListener('input',saveSoon);ed.addEventListener('change',e=>{if(e.target.type==='checkbox'){e.target.toggleAttribute('checked',e.target.checked);e.target.closest('.task')?.classList.toggle('done',e.target.checked);saveSoon()}});ed.addEventListener('click',e=>{if(e.target.type==='checkbox')setTimeout(()=>{e.target.toggleAttribute('checked',e.target.checked);e.target.closest('.task')?.classList.toggle('done',e.target.checked);saveSoon()},0)});
ed.addEventListener('paste',e=>{if(textMode==='plain'||e.shiftKey){e.preventDefault();let x=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,x);saveSoon()}});
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&k==='k'){e.preventDefault();mkLink()}if((e.ctrlKey||e.metaKey)&&k==='s'){e.preventDefault();save();note('✓')}if((e.ctrlKey||e.metaKey)&&k==='f'){e.preventDefault();showFind()}if(e.key==='Tab'&&document.activeElement===ed){e.preventDefault();document.execCommand('insertText',false,'  ');saveSoon()}if(e.key==='Escape'&&document.body.classList.contains('zen'))zenOff()});
function updToc(){let hs=[...ed.querySelectorAll('h1,h2,h3,h4,h5,h6')],html='';hs.forEach((h,i)=>{if(!h.id)h.id='h'+Date.now()+i;html+='<button class=lv'+h.tagName.slice(1)+' onclick="document.getElementById(\''+h.id+'\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">'+esc(h.innerText.trim()||h.tagName)+'</button>'});toclist.innerHTML=html||'<button disabled>∅</button>'}
function togToc(){document.body.classList.toggle('notoc');document.body.classList.toggle('showtoc')}
let findState={q:'',items:[],idx:-1};
function showFind(){document.getElementById('findp').classList.add('show');document.getElementById('fq').focus();countFind()}
function hideFind(){document.getElementById('findp').classList.remove('show')}
function reEsc(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function textNodes(root){let w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});let a=[],n;while(n=w.nextNode())a.push(n);return a}
function collectFind(){let q=document.getElementById('fq').value;let old=findState.q;if(q!==old){findState.idx=-1;findState.q=q}let items=[];if(q){let re=new RegExp(reEsc(q),'gi');textNodes(ed).forEach(node=>{let m;re.lastIndex=0;while((m=re.exec(node.nodeValue)))items.push({node,start:m.index,end:m.index+m[0].length});});}findState.items=items;document.getElementById('fc').textContent=q?items.length+'×':'';return items}
function selectMatch(m){let r=document.createRange();r.setStart(m.node,m.start);r.setEnd(m.node,m.end);let s=getSelection();s.removeAllRanges();s.addRange(r);let el=m.node.parentElement;el&&el.scrollIntoView({block:'center',behavior:'smooth'});ed.focus()}
function countFind(){return collectFind().length}
function findNext(){let items=collectFind();if(!items.length)return note('0×');findState.idx=(findState.idx+1)%items.length;selectMatch(items[findState.idx])}
function replaceRange(m,txt){let r=document.createRange();r.setStart(m.node,m.start);r.setEnd(m.node,m.end);r.deleteContents();r.insertNode(document.createTextNode(txt));getSelection().removeAllRanges()}
function selectedMatch(q){let s=getSelection();if(!s||!s.rangeCount||s.toString().toLowerCase()!==q.toLowerCase())return null;let r=s.getRangeAt(0);return r.startContainer===r.endContainer&&r.startContainer.nodeType===3?{node:r.startContainer,start:r.startOffset,end:r.endOffset}:null}
function replaceOne(){let q=document.getElementById('fq').value,r=document.getElementById('rp').value;if(!q)return;let m=selectedMatch(q);if(!m){let items=collectFind();if(!items.length)return note('0×');findState.idx=(findState.idx+1)%items.length;m=items[findState.idx]}replaceRange(m,r);saveSoon();collectFind();note('替换')}
function replaceAll(){let q=document.getElementById('fq').value,r=document.getElementById('rp').value;if(!q)return;let re=new RegExp(reEsc(q),'gi'),n=0;textNodes(ed).forEach(node=>{let v=node.nodeValue,c=(v.match(re)||[]).length;if(c){n+=c;node.nodeValue=v.replace(re,r)}});saveSoon();countFind();note('全部 '+n)}
document.getElementById('fq').addEventListener('input',()=>{findState.idx=-1;countFind()});function copyPlain(){let x=ed.innerText;navigator.clipboard?.writeText(x).then(()=>note('⎘¶')).catch(()=>{let a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();note('⎘¶')})}
function copyRich(){let r=document.createRange();r.selectNodeContents(ed);let s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();note('⎘T')}
function downloadNote(){save();let body=ed.innerHTML,title='quick-note-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.html';let h='<!doctype html><meta charset=utf-8><title>Quick Note Export</title><body style="font:14px/1.7 system-ui,Microsoft YaHei,sans-serif;padding:32px;max-width:920px;margin:auto">'+body+'</body>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html;charset=utf-8'}));a.download=title;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);note('⭳')}
function clearEd(){if(confirm('清空当前内容？')){ed.innerHTML='';save();note('🧹')}}
function zenOn(){document.body.classList.add('zen');document.body.classList.add('notoc');ed.focus()}function zenOff(){document.body.classList.remove('zen');ed.focus()}
window.addEventListener('beforeunload',e=>{if(ed.innerText.trim()||ed.innerHTML.trim()){save();e.preventDefault();e.returnValue=''}});restore();setTextModeBtn();updToc();ed.focus();
</script></body></html>
