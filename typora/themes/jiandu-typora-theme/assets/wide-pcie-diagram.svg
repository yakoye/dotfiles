<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
  <title id="title">Wide PCIe printing test image</title>
  <desc id="desc">A wide local SVG used to test A4 fitting and image centering.</desc>
  <rect width="1800" height="620" fill="#f7faf8"/>
  <rect x="1" y="1" width="1798" height="618" rx="24" fill="none" stroke="#8aa899" stroke-width="3"/>
  <text x="900" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#213d2a">PCIe Link Path — Wide Image Print Test</text>
  <text x="900" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#50705b">The image must remain centered, proportional, and completely visible on A4.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(95 230)">
      <rect width="250" height="150" rx="18" fill="#e1efe3" stroke="#4e8062" stroke-width="3"/>
      <text x="125" y="62" font-size="28" font-weight="700" fill="#23402d">CPU Root Port</text>
      <text x="125" y="102" font-size="20" fill="#45614d">LTSSM / AER</text>
    </g>
    <g transform="translate(475 230)">
      <rect width="250" height="150" rx="18" fill="#e5f0f7" stroke="#4b7fa3" stroke-width="3"/>
      <text x="125" y="62" font-size="28" font-weight="700" fill="#23465f">Switch Upstream</text>
      <text x="125" y="102" font-size="20" fill="#47677d">Gen5 x16</text>
    </g>
    <g transform="translate(855 230)">
      <rect width="250" height="150" rx="18" fill="#f8ecdc" stroke="#a36d45" stroke-width="3"/>
      <text x="125" y="62" font-size="28" font-weight="700" fill="#5b3e29">Switch Downstream</text>
      <text x="125" y="102" font-size="20" fill="#7c5b43">ACS / P2P</text>
    </g>
    <g transform="translate(1235 230)">
      <rect width="250" height="150" rx="18" fill="#e8edf8" stroke="#5e78ad" stroke-width="3"/>
      <text x="125" y="62" font-size="28" font-weight="700" fill="#31466f">GPU Endpoint</text>
      <text x="125" y="102" font-size="20" fill="#52698f">BAR / MSI-X</text>
    </g>
  </g>
  <g stroke="#547564" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M345 305 H475"/>
    <path d="M725 305 H855"/>
    <path d="M1105 305 H1235"/>
  </g>
  <g fill="#547564">
    <path d="M465 292 L492 305 L465 318 Z"/>
    <path d="M845 292 L872 305 L845 318 Z"/>
    <path d="M1225 292 L1252 305 L1225 318 Z"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="19" fill="#4d6656">
    <text x="410" y="275" text-anchor="middle">DLLP / TLP</text>
    <text x="790" y="275" text-anchor="middle">Equalization</text>
    <text x="1170" y="275" text-anchor="middle">DMA / Completion</text>
  </g>
  <line x1="100" y1="475" x2="1700" y2="475" stroke="#c2d6c8" stroke-width="2"/>
  <text x="900" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#496354">Suggested test: choose A4, 100% scale, then check that both left and right borders are visible.</text>
</svg>
