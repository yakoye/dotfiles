<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1800" viewBox="0 0 720 1800" role="img" aria-labelledby="title desc">
  <title id="title">Tall image print test</title>
  <desc id="desc">A tall local SVG used to verify that a print theme preserves the complete image without clipping.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#edf6f0"/>
      <stop offset="1" stop-color="#d7e8db"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1800" fill="url(#g)"/>
  <rect x="18" y="18" width="684" height="1764" rx="24" fill="none" stroke="#4e8062" stroke-width="4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="360" y="105" font-size="32" font-weight="700" fill="#254630">Tall Image Print Test</text>
    <text x="360" y="147" font-size="18" fill="#506e59">The entire image should scale proportionally into the printable A4 area.</text>
  </g>
  <g transform="translate(92 245)" font-family="Arial, sans-serif">
    <g>
      <circle cx="268" cy="0" r="42" fill="#6fa47c"/>
      <text x="268" y="10" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">1</text>
      <rect x="0" y="75" width="536" height="175" rx="18" fill="#ffffff" stroke="#8bb198" stroke-width="3"/>
      <text x="268" y="130" text-anchor="middle" font-size="25" font-weight="700" fill="#2b5036">Image width</text>
      <text x="268" y="175" text-anchor="middle" font-size="19" fill="#59705e">Never exceed the printable width.</text>
      <text x="268" y="208" text-anchor="middle" font-size="19" fill="#59705e">Do not crop the right edge.</text>
    </g>
    <g transform="translate(0 370)">
      <circle cx="268" cy="0" r="42" fill="#6fa47c"/>
      <text x="268" y="10" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">2</text>
      <rect x="0" y="75" width="536" height="175" rx="18" fill="#ffffff" stroke="#8bb198" stroke-width="3"/>
      <text x="268" y="130" text-anchor="middle" font-size="25" font-weight="700" fill="#2b5036">Image height</text>
      <text x="268" y="175" text-anchor="middle" font-size="19" fill="#59705e">Tall images remain complete first.</text>
      <text x="268" y="208" text-anchor="middle" font-size="19" fill="#59705e">The theme limits height without distortion.</text>
    </g>
    <g transform="translate(0 740)">
      <circle cx="268" cy="0" r="42" fill="#6fa47c"/>
      <text x="268" y="10" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">3</text>
      <rect x="0" y="75" width="536" height="175" rx="18" fill="#ffffff" stroke="#8bb198" stroke-width="3"/>
      <text x="268" y="130" text-anchor="middle" font-size="25" font-weight="700" fill="#2b5036">Pagination</text>
      <text x="268" y="175" text-anchor="middle" font-size="19" fill="#59705e">Avoid splitting an image across pages.</text>
      <text x="268" y="208" text-anchor="middle" font-size="19" fill="#59705e">Keep visual content readable.</text>
    </g>
    <g transform="translate(0 1110)">
      <circle cx="268" cy="0" r="42" fill="#6fa47c"/>
      <text x="268" y="10" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">4</text>
      <rect x="0" y="75" width="536" height="175" rx="18" fill="#ffffff" stroke="#8bb198" stroke-width="3"/>
      <text x="268" y="130" text-anchor="middle" font-size="25" font-weight="700" fill="#2b5036">Center alignment</text>
      <text x="268" y="175" text-anchor="middle" font-size="19" fill="#59705e">The image should remain centered.</text>
      <text x="268" y="208" text-anchor="middle" font-size="19" fill="#59705e">No asymmetric clipping or drifting.</text>
    </g>
  </g>
  <text x="360" y="1712" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#3e684a">End of tall test image</text>
</svg>
