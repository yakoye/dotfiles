<svg xmlns="http://www.w3.org/2000/svg" width="920" height="920" viewBox="0 0 920 920" role="img" aria-labelledby="title desc">
  <title id="title">Square image print test</title>
  <desc id="desc">A square local SVG to test image border, centering, and spacing.</desc>
  <rect width="920" height="920" fill="#f7faf8"/>
  <rect x="24" y="24" width="872" height="872" rx="32" fill="none" stroke="#4e8062" stroke-width="4"/>
  <circle cx="460" cy="400" r="225" fill="#e1efe3" stroke="#4e8062" stroke-width="4"/>
  <path d="M300 460 C350 310 455 300 520 390 C575 465 655 440 690 350" fill="none" stroke="#4e8062" stroke-width="18" stroke-linecap="round"/>
  <path d="M300 460 C380 530 495 570 625 485" fill="none" stroke="#83ab8f" stroke-width="18" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="460" y="145" font-size="38" font-weight="700" fill="#254630">Square Image Test</text>
    <text x="460" y="720" font-size="25" fill="#4d6955">A local SVG for spacing and border verification</text>
    <text x="460" y="765" font-size="20" fill="#6b8372">Expected: centered, proportional, no clipping.</text>
  </g>
